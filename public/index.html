<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Productos Cloud - Vercel</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="container">
    <h1>Aplicación de Productos en la Nube</h1>
    <p class="subtitle">Arquitectura de dos capas: Vercel + Supabase PostgreSQL</p>

    <div class="badges">
      <span class="badge">Capa 1: Aplicación en Vercel</span>
      <span class="badge">Capa 2: Base de datos en Supabase</span>
    </div>

    <div class="controls">
      <input id="filtro" placeholder="Buscar productos por nombre..." />
    </div>

    <form id="productoForm" class="form-grid">
      <input type="text" id="nombre" placeholder="Nombre" required>
      <input type="text" id="descripcion" placeholder="Descripción">
      <input type="number" id="precio" placeholder="Precio" step="0.01" required>
      <input type="number" id="stock" placeholder="Stock" required>
      <button type="submit" class="primary">Guardar producto</button>
    </form>

    <div id="productosList" class="grid-list"></div>

    <div id="toast" class="toast" aria-live="polite"></div>
  </div>

  <script>
    const API_URL = "/api/productos";

    let productosCache = [];

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('visible');
      setTimeout(() => t.classList.remove('visible'), 2500);
    }

    async function cargarProductos() {
      const respuesta = await fetch(API_URL);
      const productos = await respuesta.json();
      productosCache = productos;
      renderProductos(productos);
    }

    function renderProductos(list) {
      const cont = document.getElementById('productosList');
      cont.innerHTML = '';

      if (!list.length) {
        cont.innerHTML = '<p class="muted">No hay productos registrados.</p>';
        return;
      }

      list.forEach(producto => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="card-body">
            <div class="card-title">${producto.nombre} <span class="pill">#${producto.id}</span></div>
            <div class="card-desc">${producto.descripcion || ''}</div>
            <div class="card-meta">Precio: Q ${producto.precio} · Stock: ${producto.stock}</div>
          </div>
          <div class="card-actions">
            <button class="danger" onclick="confirmEliminar(${producto.id}, '${(producto.nombre||'').replace(/'/g,"\\'")}')">Eliminar</button>
          </div>
        `;

        cont.appendChild(card);
      });
    }

    async function eliminarProducto(id) {
      const res = await fetch(`${API_URL}?id=${id}`, { method: 'DELETE' });
      if (res.ok) {
        showToast('Producto eliminado');
        cargarProductos();
      } else {
        showToast('Error al eliminar');
      }
    }

    function confirmEliminar(id, nombre) {
      if (confirm(`Eliminar "${nombre}"?`)) eliminarProducto(id);
    }

    document.getElementById("productoForm").addEventListener("submit", async function(e) {
      e.preventDefault();

      const producto = {
        nombre: document.getElementById("nombre").value,
        descripcion: document.getElementById("descripcion").value,
        precio: parseFloat(document.getElementById("precio").value),
        stock: parseInt(document.getElementById("stock").value)
      };

      const res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(producto)
      });

      if (res.ok) {
        this.reset();
        showToast('Producto guardado');
        cargarProductos();
      } else {
        showToast('Error al guardar');
      }
    });

    document.getElementById('filtro').addEventListener('input', function(e){
      const q = e.target.value.toLowerCase().trim();
      if (!q) return renderProductos(productosCache);
      renderProductos(productosCache.filter(p => (p.nombre||'').toLowerCase().includes(q)));
    });

    cargarProductos();
  </script>
</body>
</html>
